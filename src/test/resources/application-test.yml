spring:
  datasource:
    url: jdbc:h2:mem:gonggeumi;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
