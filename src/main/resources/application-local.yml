# 로컬 개발 전용. 운영에서는 prod 프로필과 외부 환경변수를 사용한다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gonggeumi?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED}
    username: ${DB_USERNAME:gonggeumi}
    password: ${DB_PASSWORD:local-only-password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
