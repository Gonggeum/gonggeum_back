name: Backend verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start isolated test databases
        run: docker compose -f compose.test.yml up -d --wait --wait-timeout 120
      - name: Build and test
        run: ./mvnw -B -Pmysql-it verify
      - name: Database diagnostics
        if: failure()
        run: docker compose -f compose.test.yml logs --no-color --tail 100
      - name: Stop test databases
        if: always()
        run: docker compose -f compose.test.yml down
