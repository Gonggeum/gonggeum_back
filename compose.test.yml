# 개발 DB/볼륨과 분리된 통합 시험 전용 환경.
name: gonggeumi-test
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gonggeumi_test
      MYSQL_USER: gonggeumi_test
      MYSQL_PASSWORD: test-only-password
      MYSQL_ROOT_PASSWORD: test-only-root
      TZ: UTC
    ports:
      - "127.0.0.1:13306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
